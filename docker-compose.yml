services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: >
      sh -c "npm i
      && npm run start:debug"
    volumes:
      - .:/app
    ports:
      - "${PORT}:${PORT}"
      - '9229:9229'
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    ports:
      - '${DB_EXTERNAL_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}